<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flemish Flashcards has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://flemish-flashcards.github.io/">
<style>
  :root{--bg:#f5f2ea;--card:#fff;--text:#1d1d1b;--muted:#66625a;--accent:#f2c500}
  @media (prefers-color-scheme: dark){:root{--bg:#121210;--card:#1d1c19;--text:#f1eee6;--muted:#aaa392}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:16px;box-sizing:border-box}
  main{max-width:460px;background:var(--card);border-radius:20px;border-top:8px solid var(--text);padding:28px 24px;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.12)}
  .big{font-size:48px} h1{font-size:22px;margin:8px 0} p{line-height:1.5;color:var(--muted)}
  a.btn{display:inline-block;margin-top:8px;background:var(--accent);color:#1d1d1b;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:12px}
</style>
</head>
<body>
<main>
  <div class="big">🦁</div>
  <h1>Flemish Flashcards has moved</h1>
  <p>The new address is <b>flemish-flashcards.github.io</b>. Taking you there now, together with your progress…</p>
  <a class="btn" id="go" href="https://flemish-flashcards.github.io/">Go to the new address</a>
  <p style="font-size:14px">Installed the app from this old address? After this, remove the old icon and install the app again from the new address.</p>
</main>
<script>
// This page replaces the old site at digstraightthrough.github.io/flemish-flashcards/ (moved in November 2026).
// Browsers keep saved progress per web address, so this page reads the progress saved here, packs it into the
// link to the new address (after "#", a part of a link that is never sent to any server) and goes there.
// Nothing is deleted here except the old offline copy; the new site picks out its own cards.
const NEW_HOME = "https://flemish-flashcards.github.io/";
// local testing only: when this page runs on 127.0.0.1, "?to=http://localhost:PORT/" points to a test copy
const testTo = new URLSearchParams(location.search).get("to");
const target = (location.hostname === "127.0.0.1" && testTo && /^http:\/\/localhost:\d+\/$/.test(testTo)) ? testTo : NEW_HOME;

function read(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function collect(){
  // this site saved under "fl:" names; before November 2026 its cards could also sit in the plain "known" list,
  // which it shared with the Greek site (Greek cards are left out here to keep the link short)
  const greek = /[Ͱ-Ͽἀ-῿]/;
  const shared = read("known", []).filter(id => typeof id === "string" && !id.startsWith("exam:") && !greek.test(id));
  const sharedBest = Object.fromEntries(Object.entries(read("best", {})).filter(([k]) => k.startsWith("flemish/")));
  const p = {v: 1, known: [...new Set([...read("fl:known", []), ...shared])], best: {...sharedBest, ...read("fl:best", {})}, settings: {}};
  for(const k of ["reverse", "quizPick"]){ const v = read("fl:" + k, undefined); if(v !== undefined) p.settings[k] = v; }
  return p;
}
const hasProgress = p => p.known.length || Object.keys(p.best).length;
function b64url(bytes){
  let s = "";
  for(let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function pack(obj){
  const json = JSON.stringify(obj);
  try {
    const stream = new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return "z:" + b64url(new Uint8Array(await new Response(stream).arrayBuffer()));
  } catch(e){ return "j:" + b64url(new TextEncoder().encode(json)); }  // older browsers: not compressed
}
async function removeOldOfflineCopy(){
  try { for(const r of await navigator.serviceWorker.getRegistrations()) if(r.scope.endsWith("/flemish-flashcards/")) await r.unregister(); } catch(e){}
  try { for(const k of await caches.keys()) if(k.startsWith("fl-")) await caches.delete(k); } catch(e){}
}
(async () => {
  const p = collect();
  let link = target;
  try { if(hasProgress(p)) link = target + "#move=" + await pack(p); } catch(e){}
  document.getElementById("go").href = link;
  await Promise.race([removeOldOfflineCopy(), new Promise(r => setTimeout(r, 2000))]);
  location.replace(link);
})();
</script>
</body>
</html>
